name: CI/CD — test, secure, build, performance, deploy

# Every push / PR: lint, tests (against real MySQL + Garage + Meilisearch),
# security scans and the five deployable Docker images.
# Push to main: + automatic deploy to Railway once lint/tests/security pass
# (scripts/railway_bootstrap.py creates whatever is missing in the Railway
# project: services, volumes, variables, secrets, public domain), and a
# performance (load) test of the whole stack, downloadable report.
# Data lives on the services' volumes (MySQL, storage, search): a deploy never
# touches it. Railway costs are checked daily by railway-usage.yml.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_perf:
        description: "Run the performance (load) test"
        type: boolean
        default: true
      perf_users:
        description: "Concurrent users per stage (comma separated)"
        type: string
        default: "5,100,1000"
      perf_duration:
        description: "Seconds per stage"
        type: string
        default: "60"
      perf_cpus:
        description: "vCPUs given to the backend container"
        type: string
        default: "1"
      perf_memory:
        description: "RAM limit of the backend container"
        type: string
        default: "512m"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app server.py docker-entrypoint.py
      - name: Format check (black)
        run: black --check app server.py tests
      - name: Start MySQL, Garage and Meilisearch (throw-away secrets)
        run: |
          rnd() { python -c "import secrets,sys; print(secrets.token_hex(int(sys.argv[1])))" "$1"; }
          sed -e "s/^FIHI_MYSQL_PASSWORD=.*/FIHI_MYSQL_PASSWORD=$(rnd 16)/" \
              -e "s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=$(rnd 16)/" \
              -e "s/^FIHI_S3_ACCESS_KEY=.*/FIHI_S3_ACCESS_KEY=GK$(rnd 12)/" \
              -e "s/^FIHI_S3_SECRET_KEY=.*/FIHI_S3_SECRET_KEY=$(rnd 32)/" \
              -e "s/^GARAGE_RPC_SECRET=.*/GARAGE_RPC_SECRET=$(rnd 32)/" \
              -e "s/^FIHI_MEILI_KEY=.*/FIHI_MEILI_KEY=$(rnd 16)/" \
              -e "s/^FIHI_ENV=.*/FIHI_ENV=development/" \
              .env.example > .env
          docker compose up -d --build --wait fluentd mysql storage search
      - name: Tests + coverage (each test deletes the data it creates)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 80 mysql storage search
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install bandit pip-audit
      - name: Bandit (SAST)
        run: bandit -r app -c pyproject.toml -f sarif -o bandit.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit -r requirements.txt --desc

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  build:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint-test, security]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: backend, dockerfile: Dockerfile }
          - { service: frontend, dockerfile: deploy/frontend/Dockerfile }
          - { service: mysql, dockerfile: deploy/mysql/Dockerfile }
          - { service: storage, dockerfile: deploy/garage/Dockerfile }
          - { service: search, dockerfile: deploy/search/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/fihi-chifae-${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}

  # ───────────────────────────── performance ─────────────────────────────
  performance:
    name: Performance (Locust load test, whole stack)
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'workflow_dispatch' && inputs.run_perf)
    needs: [lint-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Locust + report tooling
        run: pip install -r perf/requirements.txt
      - name: Load test (stages of concurrent users) + resource sampling
        env:
          PERF_USERS: ${{ inputs.perf_users || '5,100,1000' }}
          PERF_DURATION: ${{ inputs.perf_duration || '60' }}
          PERF_CPUS: ${{ inputs.perf_cpus || '1' }}
          PERF_MEMORY: ${{ inputs.perf_memory || '512m' }}
          PERF_OUT: perf-results
        run: bash perf/run.sh
      - name: Upload report (open report.html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-results/
          retention-days: 30
          if-no-files-found: warn

  # ───────────────────────── automatic deployment ─────────────────────────
  deploy-railway:
    name: Deploy → Railway
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    needs: [lint-test, security]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: railway-deploy
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Files changed by this push
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          {
            echo "files<<EOF"
            if [ "${{ github.event_name }}" = "push" ]; then
              git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || echo ALL
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare the Railway project (services, volumes, variables, domain)
        id: bootstrap
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
          # project token for the Railway CLI (temporary one when only an
          # account/workspace token was given); never printed
          DEPLOY_TOKEN_FILE: ${{ runner.temp }}/railway-deploy-token
        run: python scripts/railway_bootstrap.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy (${{ steps.bootstrap.outputs.deploy }})
        env:
          DEPLOY_TOKEN_FILE: ${{ runner.temp }}/railway-deploy-token
        run: |
          npm install -g @railway/cli
          RAILWAY_TOKEN="$(cat "$DEPLOY_TOKEN_FILE")"
          export RAILWAY_TOKEN
          bash scripts/railway_deploy.sh ${{ steps.bootstrap.outputs.deploy }}
      - name: Remove the temporary deploy token
        if: always() && steps.bootstrap.outcome != 'skipped'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          rm -f "${{ runner.temp }}/railway-deploy-token"
          python scripts/railway_bootstrap.py --cleanup || true
      - name: Wait until the shop answers
        env:
          URL: ${{ steps.bootstrap.outputs.url }}
        run: |
          for i in $(seq 1 90); do
            if curl -fsS "$URL/healthz" >/dev/null && curl -fsS "$URL/api/v1/ping" >/dev/null; then
              echo "shop is up: $URL"
              {
                echo "## Shop deployed"
                echo ""
                echo "**$URL** (admin: $URL/admin-login.html, user \`admin\`)"
                echo ""
                echo "Admin password: Railway → backend → Variables → \`FIHI_ADMIN_PASSWORD\`"
                echo "(change it from the dashboard's profile panel)."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL did not answer within 15 minutes: check the backend / frontend logs in Railway"
          exit 1
