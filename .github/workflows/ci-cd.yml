name: CI/CD — test, secure, build, performance, deploy (manual)

# Every push / PR: lint, tests (against real MySQL + Garage + Meilisearch),
# security scans and the five deployable Docker images.
# Push to main: + performance (load) test of the whole stack, downloadable report.
# "Run workflow" (Actions tab): choose a performance test and/or a Railway deploy.
# Deployment ONLY happens when you ask for it; data lives on the services'
# volumes (MySQL, storage, search), so a deploy never touches it.
# Railway costs are checked daily by a separate workflow (railway-usage.yml).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Railway"
        type: boolean
        default: false
      services:
        description: "Railway services to deploy (comma separated)"
        type: string
        default: "backend,frontend"
      run_perf:
        description: "Run the performance (load) test"
        type: boolean
        default: true
      perf_users:
        description: "Concurrent users per stage (comma separated)"
        type: string
        default: "5,100,1000"
      perf_duration:
        description: "Seconds per stage"
        type: string
        default: "60"
      perf_cpus:
        description: "vCPUs given to the backend container"
        type: string
        default: "1"
      perf_memory:
        description: "RAM limit of the backend container"
        type: string
        default: "512m"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app server.py docker-entrypoint.py
      - name: Format check (black)
        run: black --check app server.py tests
      - name: Start MySQL, Garage and Meilisearch (throw-away secrets)
        run: |
          rnd() { python -c "import secrets,sys; print(secrets.token_hex(int(sys.argv[1])))" "$1"; }
          sed -e "s/^FIHI_MYSQL_PASSWORD=.*/FIHI_MYSQL_PASSWORD=$(rnd 16)/" \
              -e "s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=$(rnd 16)/" \
              -e "s/^FIHI_S3_ACCESS_KEY=.*/FIHI_S3_ACCESS_KEY=GK$(rnd 12)/" \
              -e "s/^FIHI_S3_SECRET_KEY=.*/FIHI_S3_SECRET_KEY=$(rnd 32)/" \
              -e "s/^GARAGE_RPC_SECRET=.*/GARAGE_RPC_SECRET=$(rnd 32)/" \
              -e "s/^FIHI_MEILI_KEY=.*/FIHI_MEILI_KEY=$(rnd 16)/" \
              -e "s/^FIHI_ENV=.*/FIHI_ENV=development/" \
              .env.example > .env
          docker compose up -d --build --wait fluentd mysql storage search
      - name: Tests + coverage (each test deletes the data it creates)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 80 mysql storage search
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install bandit pip-audit
      - name: Bandit (SAST)
        run: bandit -r app -c pyproject.toml -f sarif -o bandit.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit -r requirements.txt --desc

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  build:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint-test, security]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: backend, dockerfile: Dockerfile }
          - { service: frontend, dockerfile: deploy/frontend/Dockerfile }
          - { service: mysql, dockerfile: deploy/mysql/Dockerfile }
          - { service: storage, dockerfile: deploy/garage/Dockerfile }
          - { service: search, dockerfile: deploy/search/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/fihi-chifae-${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}

  # ───────────────────────────── performance ─────────────────────────────
  performance:
    name: Performance (Locust load test, whole stack)
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'workflow_dispatch' && inputs.run_perf)
    needs: [lint-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Locust + report tooling
        run: pip install -r perf/requirements.txt
      - name: Load test (stages of concurrent users) + resource sampling
        env:
          PERF_USERS: ${{ inputs.perf_users || '5,100,1000' }}
          PERF_DURATION: ${{ inputs.perf_duration || '60' }}
          PERF_CPUS: ${{ inputs.perf_cpus || '1' }}
          PERF_MEMORY: ${{ inputs.perf_memory || '512m' }}
          PERF_OUT: perf-results
        run: bash perf/run.sh
      - name: Upload report (open report.html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-results/
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────── manual deployment ───────────────────────────
  deploy-railway:
    name: Deploy → Railway
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [lint-test, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy each service with the Railway CLI (volumes are kept)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICES: ${{ inputs.services }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Set the RAILWAY_TOKEN secret (see deployment-guide.md)"
            exit 1
          fi
          npm install -g @railway/cli
          for svc in ${SERVICES//,/ }; do
            echo "::group::railway up --service $svc"
            railway up --service "$svc" --ci
            echo "::endgroup::"
          done
      - name: Smoke test
        if: vars.PUBLIC_URL != ''
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ vars.PUBLIC_URL }}/api/v1/ping" && curl -fsS "${{ vars.PUBLIC_URL }}/healthz" && exit 0
            sleep 10
          done
          exit 1
