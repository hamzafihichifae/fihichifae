# fihi-chifae log collector.
# Inputs : Docker "fluentd" logging driver (every compose container),
#          optional: backend JSON over HTTP (FIHI_FLUENTD_URL),
#          nginx access/error logs over syslog UDP (FLUENTD_SYSLOG).
# Output : one gzip file per source per day under /fluentd/log/<tag>/,
#          older than LOG_RETENTION_DAYS deleted by the entrypoint.
# Local development only (docker compose); not deployed on Railway.
<system>
  workers 1
  log_level warn
</system>

# Fluentd's own messages stay on its stdout, not in the collected files
<label @FLUENT_LOG>
  <match **>
    @type null
  </match>
</label>

<source>
  @type http
  bind 0.0.0.0
  port 9880
  body_size_limit 8m
  keepalive_timeout 10s
  <parse>
    @type json
    time_key time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%LZ
    keep_time_key true
  </parse>
</source>

<source>
  @type syslog
  bind 0.0.0.0
  port 5140
  tag nginx
  <transport udp>
  </transport>
  <parse>
    @type syslog
    message_format auto
  </parse>
</source>

<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>

# drop health-check noise
<filter fihi.backend>
  @type grep
  <exclude>
    key path
    pattern /^\/api\/v1\/(ping|admin\/session)$/
  </exclude>
</filter>

# nginx access lines are JSON inside the syslog message: keep them structured
<filter nginx.local7.info>
  @type parser
  key_name message
  reserve_data false
  emit_invalid_record_to_error false
  <parse>
    @type json
    time_key time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S%:z
    keep_time_key true
  </parse>
</filter>

# nginx over syslog arrives as nginx.<facility>.<severity>: one folder for all of it
<match nginx.**>
  @type file
  path /fluentd/log/nginx/%Y-%m-%d
  append true
  compress gzip
  <format>
    @type json
  </format>
  <inject>
    tag_key tag
    time_key ts
    time_type string
    time_format %Y-%m-%dT%H:%M:%S%z
  </inject>
  <buffer time>
    @type file
    path /fluentd/buffer/nginx
    timekey 1d
    timekey_wait 5m
    timekey_use_utc true
    flush_mode interval
    flush_interval 30s
    chunk_limit_size 8m
    total_limit_size 128m
    overflow_action drop_oldest_chunk
  </buffer>
</match>

<match **>
  @type file
  path /fluentd/log/${tag}/%Y-%m-%d
  append true
  compress gzip
  <format>
    @type json
  </format>
  <inject>
    tag_key tag
    time_key ts
    time_type string
    time_format %Y-%m-%dT%H:%M:%S%z
  </inject>
  <buffer tag,time>
    @type file
    path /fluentd/buffer/all
    timekey 1d
    timekey_wait 5m
    timekey_use_utc true
    flush_mode interval
    flush_interval 30s
    chunk_limit_size 8m
    total_limit_size 256m
    overflow_action drop_oldest_chunk
  </buffer>
</match>
