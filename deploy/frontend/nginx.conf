# Small footprint: one worker is plenty for this shop (~3-6 MB RSS).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types { image/webp webp; }

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_body_buffer_size 64k;
  client_max_body_size 16m;   # product images travel as base64 JSON

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  log_format fihi_json escape=json
    '{"time":"$time_iso8601","service":"frontend","ip":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"ms":$request_time,"ua":"$http_user_agent"}';

  include /etc/nginx/conf.d/*.conf;
}
